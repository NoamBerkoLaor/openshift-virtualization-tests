name: Create Issue from PR Comment

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  create-issue:
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'Learnings added')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Learning Content and Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Use sed/awk to find "Learnings added" line (handling icons/formatting) and grab text following it
          LEARNING_CONTENT=$(echo "$COMMENT_BODY" | awk '/Learnings added/{flag=1; next} flag')
          
          # Fallback: if extracting text fails, use the full comment body
          if [ -z "$LEARNING_CONTENT" ]; then
            LEARNING_CONTENT="$COMMENT_BODY"
          fi
          
          gh issue create \
            --title "CodeRabbit Learning from PR #${PR_NUMBER}" \
            --body "### Learning extracted from PR #${PR_NUMBER} (by @${COMMENT_AUTHOR}):
          ${LEARNING_CONTENT}"